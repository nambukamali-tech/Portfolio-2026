name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore Portfolio.slnx

    - name: Build C# Solution
      run: dotnet build Portfolio.slnx --configuration Release --no-restore

    - name: Run Backend Unit & Integration Tests
      run: dotnet test Portfolio.slnx --configuration Release --no-build --verbosity normal
